server:
  port: 8082
  servlet:
    context-path: /crm/v1

spring:
  application:
    name: vincent-crm

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vincent_crm?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root123456

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Flyway 配置
  flyway:
    enabled: true
    locations: classpath:migration
    table: vincent_crm_version
    baseline-on-migrate: true
    encoding: UTF-8

  # 国际化配置
  messages:
    basename: i18n/messages
    encoding: UTF-8

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
  type-aliases-package: cn.vincent.crm.**.domain
  mapper-locations: classpath*:cn/vincent/crm/**/mapper/*.xml

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Shiro 配置
shiro:
  session:
    timeout: 1800000  # 30 分钟

# 日志配置
logging:
  level:
    cn.vincent: debug
