# ============================================================
# VincentCRM 生产环境 Docker Compose 配置
# 使用方式：docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  # -------------------- MySQL 数据库 --------------------
  mysql:
    image: mysql:8.0
    container_name: vincent-crm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vincent_crm}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------- Redis 缓存 --------------------
  redis:
    image: redis:7-alpine
    container_name: vincent-crm-redis
    restart: always
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- 后端服务 --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vincent-crm-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-vincent_crm}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    networks:
      - crm-network

  # -------------------- 前端服务 --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vincent-crm-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - crm-network

# -------------------- 网络配置 --------------------
networks:
  crm-network:
    driver: bridge

# -------------------- 数据卷 --------------------
volumes:
  mysql-data:
  redis-data:
